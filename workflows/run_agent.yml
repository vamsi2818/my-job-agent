name: Run Job Search Agent

on:
  schedule:
    # Runs daily at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger via the GitHub Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Ensures we pull the full repository context into the workspace root
        path: '.'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai requests

    - name: Run Job Agent
      env: 
        # Load secure secrets stored in your GitHub Repo settings
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: |
        # Find job_agent.py dynamically in case of path mismatches and run it
        SCRIPT_PATH=$(find . -name "job_agent.py" -print -quit)
        if [ -z "$SCRIPT_PATH" ]; then
          echo "❌ Error: job_agent.py could not be found anywhere in the repository workspace!"
          exit 1
        fi
        echo "🚀 Running script found at: $SCRIPT_PATH"
        python "$SCRIPT_PATH"

    - name: Commit and update processed jobs tracker
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Find the tracker file path dynamically, update it, and commit it
        TRACKER_PATH=$(find . -name "processed_jobs.json" -print -quit || echo "./processed_jobs.json")
        git add "$TRACKER_PATH" || true
        git commit -m "Update processed jobs history [skip ci]" || true
        git push || true
